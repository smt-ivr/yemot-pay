<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ימות פיי · ניהול</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f6fb; --panel: #ffffff; --text: #111827; --text-2: #4b5563; --muted: #8a93a6; --border: #e7eaf2; --border-2: #d9deea;
    --brand: #4f46e5; --brand-600: #4338ca; --brand-50: #eef2ff; --brand-100: #e0e7ff;
    --side: #0f172a; --side-2: #1e293b; --side-text: #cbd5e1; --side-muted: #64748b;
    --green: #059669; --green-50: #ecfdf5; --amber: #d97706; --amber-50: #fffbeb; --red: #dc2626; --red-50: #fef2f2;
    --sky: #0284c7; --sky-50: #f0f9ff; --violet: #7c3aed; --violet-50: #f5f3ff;
    --radius: 14px; --radius-sm: 10px;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
    --shadow-lg: 0 20px 50px rgba(15,23,42,.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: "Heebo", system-ui, Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 14.5px; line-height: 1.5; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--brand); }
  code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  svg.i { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* ---------- כפתורים וטפסים ---------- */
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border-2); background: var(--panel); border-radius: 10px; padding: 8px 14px; cursor: pointer; font-weight: 500; transition: .15s; white-space: nowrap; text-decoration: none; color: var(--text); }
  .btn:hover { border-color: #c3c9d8; background: #fafbfe; }
  .btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; box-shadow: 0 1px 2px rgba(79,70,229,.3); }
  .btn.primary:hover { background: var(--brand-600); }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.ghost:hover { background: #eef1f7; }
  .btn.danger { color: var(--red); }
  .btn.danger:hover { background: var(--red-50); border-color: #fecaca; }
  .btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
  .btn.icon { padding: 6px; }
  .btn:disabled { opacity: .5; cursor: default; }
  [hidden] { display: none !important; }
  input, select, textarea { width: 100%; border: 1px solid var(--border-2); border-radius: 10px; padding: 9px 12px; background: #fff; outline: none; transition: .15s; }
  input:focus, select:focus, textarea:focus { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-100); }
  input:disabled, textarea:disabled, select:disabled { background: #f6f7fa; color: var(--text-2); }
  textarea { min-height: 90px; resize: vertical; }
  .field { margin-bottom: 14px; }
  .field > label { display: block; font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
  .field .help { font-size: 12.5px; color: var(--muted); margin-top: 5px; }
  .check { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 500; }
  .check input { width: 18px; height: 18px; accent-color: var(--brand); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .err { color: var(--red); font-size: 13.5px; min-height: 1em; }

  /* ---------- מבנה ---------- */
  .layout { display: flex; min-height: 100vh; }
  .side { width: 248px; background: var(--side); color: var(--side-text); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; flex: none; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 20px 20px 16px; color: #fff; font-weight: 800; font-size: 18px; }
  .brand .logo { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #6366f1, #a855f7); display: grid; place-items: center; }
  .brand small { display: block; font-weight: 500; font-size: 12px; color: var(--side-muted); }
  .tenant-switch { margin: 0 14px 10px; }
  .tenant-switch select { background: var(--side-2); color: #fff; border-color: #334155; }
  .tenant-switch .fixed { background: var(--side-2); border-radius: 10px; padding: 9px 12px; color: #fff; font-weight: 600; }
  .nav { flex: 1; overflow-y: auto; padding: 4px 10px 12px; }
  .nav h6 { margin: 16px 10px 6px; font-size: 11px; letter-spacing: .06em; color: var(--side-muted); font-weight: 600; }
  .nav a { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 10px; color: var(--side-text); text-decoration: none; font-weight: 500; margin-bottom: 2px; }
  .nav a:hover { background: var(--side-2); color: #fff; }
  .nav a.active { background: linear-gradient(90deg, rgba(99,102,241,.25), rgba(99,102,241,.08)); color: #fff; box-shadow: inset -3px 0 0 #818cf8; }
  .me { border-top: 1px solid #1f2a3d; padding: 14px; display: flex; align-items: center; gap: 10px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; background: linear-gradient(135deg, #6366f1, #8b5cf6); flex: none; }
  .me .who { flex: 1; min-width: 0; }
  .me .who b { display: block; color: #fff; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .me .who span { font-size: 12px; color: var(--side-muted); }
  .me .btn { color: var(--side-text); }
  .me .btn:hover { background: var(--side-2); }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; gap: 14px; padding: 22px 32px 6px; }
  .topbar h1 { font-size: 24px; margin: 0; font-weight: 800; }
  .topbar p { margin: 2px 0 0; color: var(--muted); }
  .topbar .spacer { flex: 1; }
  .menu-btn { display: none; }
  .content { padding: 16px 32px 40px; }

  /* ---------- כרטיסים וטבלאות ---------- */
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .card-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .card-head h3 { margin: 0; font-size: 16px; font-weight: 700; }
  .card-head .spacer { flex: 1; }
  .card-body { padding: 20px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 18px; }
  .kpi { padding: 18px; display: flex; gap: 14px; align-items: center; }
  .kpi .ic { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; flex: none; }
  .kpi .ic svg { width: 22px; height: 22px; }
  .kpi .lbl { color: var(--muted); font-size: 13px; font-weight: 500; }
  .kpi .num { font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
  .kpi .sub { font-size: 12px; color: var(--muted); }
  .c-brand { background: var(--brand-50); color: var(--brand); } .c-green { background: var(--green-50); color: var(--green); }
  .c-amber { background: var(--amber-50); color: var(--amber); } .c-sky { background: var(--sky-50); color: var(--sky); } .c-violet { background: var(--violet-50); color: var(--violet); }
  .dash { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 16px; }
  .chart { width: 100%; height: 220px; }
  .chart rect.bar { fill: #818cf8; } .chart rect.bar:hover { fill: var(--brand); }
  .chart text { font-size: 10px; fill: var(--muted); font-family: inherit; }
  .chart line { stroke: var(--border); }
  .rank { list-style: none; margin: 0; padding: 0; }
  .rank li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--border); }
  .rank li:last-child { border-bottom: 0; }
  .rank .bar { height: 6px; border-radius: 3px; background: var(--brand-100); flex: 1; overflow: hidden; }
  .rank .bar i { display: block; height: 100%; background: var(--brand); border-radius: 3px; }
  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .toolbar .search { position: relative; flex: 1; min-width: 200px; max-width: 340px; }
  .toolbar .search svg { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .toolbar .search input { padding-right: 36px; }
  .toolbar select { width: auto; min-width: 150px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: right; font-size: 12px; font-weight: 600; color: var(--muted); background: #f9fafc; padding: 10px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 12px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: middle; }
  tbody tr { transition: background .1s; }
  tbody tr.click:hover { background: #f8f9ff; cursor: pointer; }
  tbody tr:last-child td { border-bottom: 0; }
  td.wrap { white-space: normal; max-width: 420px; word-break: break-word; font-size: 12.5px; color: var(--text-2); }
  td.actions { width: 1%; text-align: left; }
  td.actions .btn { margin-inline-start: 2px; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: #f1f3f8; color: var(--text-2); }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .7; }
  .pill.active, .pill.success, .pill.paid, .pill.completed, .pill.on { background: var(--green-50); color: var(--green); }
  .pill.pending, .pill.scheduled, .pill.paused, .pill.warn { background: var(--amber-50); color: var(--amber); }
  .pill.failed, .pill.cancelled, .pill.refunded, .pill.off { background: var(--red-50); color: var(--red); }
  .pager { display: flex; align-items: center; gap: 8px; padding: 12px 16px; color: var(--muted); border-top: 1px solid var(--border); }
  .pager .spacer { flex: 1; }
  .empty { padding: 48px 20px; text-align: center; color: var(--muted); }
  .empty svg { width: 38px; height: 38px; color: #c7cede; display: block; margin: 0 auto 8px; }
  .person { display: flex; align-items: center; gap: 10px; }
  .person .avatar { width: 30px; height: 30px; font-size: 12px; }
  .muted { color: var(--muted); }

  /* ---------- טאבים, קוד, הגדרות ---------- */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); padding: 0 16px; overflow-x: auto; }
  .tabs button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 13px 14px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tabs button.active { color: var(--brand); border-bottom-color: var(--brand); }
  .code { position: relative; background: #0f172a; color: #e2e8f0; border-radius: 12px; padding: 14px 96px 14px 16px; direction: ltr; text-align: left; font-size: 13px; white-space: pre-wrap; word-break: break-all; margin: 0 0 10px; }
  .code .copy { position: absolute; top: 8px; right: 8px; background: #1e293b; border: 1px solid #334155; color: #cbd5e1; }
  .code .copy:hover { background: #334155; }
  .step { display: flex; gap: 14px; padding: 18px 0; border-bottom: 1px solid var(--border); }
  .step:last-child { border-bottom: 0; }
  .step .n { width: 30px; height: 30px; border-radius: 50%; background: var(--brand-50); color: var(--brand); font-weight: 800; display: grid; place-items: center; flex: none; }
  .step.done .n { background: var(--green-50); color: var(--green); }
  .step h4 { margin: 3px 0 6px; font-size: 15.5px; }
  .step p { margin: 0 0 8px; color: var(--text-2); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 14px; }
  .chip { border: 1px dashed var(--border-2); background: #fafbff; border-radius: 8px; padding: 3px 8px; font-size: 12.5px; cursor: pointer; }
  .chip:hover { border-color: var(--brand); color: var(--brand); }
  .event { border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; }
  .event-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; cursor: pointer; }
  .event-head b { flex: 1; }
  .event-body { padding: 0 16px 16px; display: none; }
  .event.open .event-body { display: block; }
  .tenant-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .tenant-card { padding: 18px; cursor: pointer; transition: .15s; }
  .tenant-card:hover { border-color: #c7d2fe; box-shadow: 0 8px 24px rgba(79,70,229,.08); }
  .tenant-card h3 { margin: 0; font-size: 17px; }
  .tenant-card .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 14px 0 12px; font-size: 13px; }
  .tenant-card .meta span { color: var(--muted); display: block; font-size: 12px; }
  .perm-table { width: 100%; }
  .perm-table td, .perm-table th { padding: 8px 10px; }
  .perm-table input { width: 16px; height: 16px; accent-color: var(--brand); }
  .detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px 20px; }
  .detail-grid span { display: block; font-size: 12px; color: var(--muted); }
  .detail-grid b { font-weight: 600; }
  .section-title { font-size: 16px; font-weight: 700; margin: 22px 0 10px; }
  .notice { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--amber-50); color: #92400e; margin-bottom: 14px; }
  .notice.info { background: var(--brand-50); color: #3730a3; }

  /* ---------- חלונות והודעות ---------- */
  dialog { border: 0; border-radius: 18px; padding: 0; width: min(640px, 94vw); box-shadow: var(--shadow-lg); }
  dialog::backdrop { background: rgba(15,23,42,.45); backdrop-filter: blur(2px); }
  .dlg-head { padding: 18px 22px; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 17px; display: flex; align-items: center; }
  .dlg-head .spacer { flex: 1; }
  .dlg-body { padding: 20px 22px; max-height: 70vh; overflow-y: auto; }
  .dlg-foot { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; gap: 8px; background: #fafbfd; border-radius: 0 0 18px 18px; }
  .dlg-foot .spacer { flex: 1; }
  .phone-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .phone-row .btn { flex: none; }
  #toast { position: fixed; bottom: 24px; left: 24px; background: #111827; color: #fff; padding: 12px 18px; border-radius: 12px; opacity: 0; transform: translateY(8px); transition: .2s; pointer-events: none; z-index: 100; box-shadow: var(--shadow-lg); max-width: 420px; }
  #toast.show { opacity: 1; transform: none; }
  #toast.error { background: var(--red); }

  /* ---------- כניסה ---------- */
  .login-wrap { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
  .login-art { background: radial-gradient(circle at 30% 20%, #6366f1, transparent 55%), radial-gradient(circle at 80% 80%, #a855f7, transparent 50%), #0f172a; color: #fff; padding: 56px; display: flex; flex-direction: column; justify-content: flex-end; }
  .login-art h2 { font-size: 34px; margin: 0 0 10px; }
  .login-art p { color: #c7d2fe; font-size: 16px; max-width: 420px; }
  .login-box { display: grid; place-items: center; padding: 32px; }
  .login-box form { width: min(380px, 100%); }
  .login-box h1 { font-size: 26px; margin: 0 0 4px; }

  .form-section { display: flex; align-items: center; gap: 10px; margin: 22px 0 12px; font-size: 13px; font-weight: 700; color: var(--brand); }
  .form-section::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .form-section:first-child { margin-top: 0; }
  .text-row { display: grid; grid-template-columns: 240px 1fr; gap: 6px 18px; padding: 14px 0; border-bottom: 1px dashed var(--border); align-items: start; }
  .text-row:last-child { border-bottom: 0; }
  .text-row .lbl b { display: block; }
  .text-row .lbl .muted { font-size: 12px; }
  .text-row textarea { min-height: 46px; }
  .text-row .vars { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .text-row.changed textarea { border-color: #a5b4fc; background: #fbfbff; }
  .text-row .reset { margin-top: 6px; }
  .preview-frame { width: 100%; height: 560px; border: 1px solid var(--border); border-radius: 12px; background: #f1f5f9; }
  .email-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  .switch-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border: 1px solid var(--border); border-radius: 12px; background: #fafbff; margin-bottom: 16px; }
  .switch-row b { display: block; }
  .switch-row .muted { font-size: 12.5px; }
  .backdrop { display: none; }

  @media (max-width: 1100px) { .kpis { grid-template-columns: repeat(2, 1fr); } .dash { grid-template-columns: 1fr; } .email-grid { grid-template-columns: 1fr; } }
  @media (max-width: 820px) {
    body { font-size: 15px; }
    .side { position: fixed; inset: 0 0 0 auto; z-index: 50; transform: translateX(100%); transition: transform .2s; width: min(290px, 86vw); }
    .side.open { transform: none; box-shadow: var(--shadow-lg); }
    .backdrop.show { display: block; position: fixed; inset: 0; background: rgba(15,23,42,.45); z-index: 40; }
    .menu-btn { display: inline-flex; }
    .topbar { position: sticky; top: 0; z-index: 30; background: rgba(244,246,251,.94); backdrop-filter: blur(6px); padding: 10px 16px; gap: 10px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
    .topbar > div:nth-child(2) { flex: 1; min-width: 0; }
    .topbar .spacer { display: none; }
    .topbar h1 { font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .topbar p { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .content { padding: 12px 12px 32px; }
    .login-wrap { grid-template-columns: 1fr; } .login-art { display: none; }
    .grid2 { grid-template-columns: 1fr; }
    .kpis { grid-template-columns: 1fr 1fr; gap: 10px; }
    .kpi { padding: 14px; flex-direction: column; align-items: flex-start; gap: 8px; }
    .kpi .ic { width: 38px; height: 38px; } .kpi .num { font-size: 20px; }
    .card-body { padding: 16px; }
    .card-head { padding: 14px 16px; flex-wrap: wrap; }
    .toolbar { padding: 12px; }
    .toolbar .search { max-width: none; min-width: 100%; }
    .toolbar select { flex: 1; min-width: 0; }
    /* טבלאות הופכות לכרטיסים */
    .table-wrap.cards table, .table-wrap.cards tbody, .table-wrap.cards tr, .table-wrap.cards td { display: block; width: 100%; }
    .table-wrap.cards thead { display: none; }
    .table-wrap.cards tr { padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .table-wrap.cards tbody tr:last-child { border-bottom: 0; }
    .table-wrap.cards td { border: 0; padding: 3px 0; white-space: normal; display: flex; gap: 10px; align-items: center; min-height: 26px; }
    .table-wrap.cards td::before { content: attr(data-label); flex: 0 0 38%; color: var(--muted); font-size: 12.5px; }
    .table-wrap.cards td[data-label=""]::before, .table-wrap.cards td.actions::before { display: none; }
    .table-wrap.cards td.actions { width: 100%; justify-content: flex-start; padding-top: 8px; flex-wrap: wrap; }
    .table-wrap.cards td.wrap { max-width: none; }
    .table-wrap.cards td:empty { display: none; }
    dialog { width: 100vw; max-width: 100vw; height: 100dvh; max-height: 100dvh; border-radius: 0; margin: 0; }
    dialog[open] { display: flex; flex-direction: column; }
    #dlg-form { display: flex; flex-direction: column; height: 100%; }
    .dlg-body { flex: 1; max-height: none; padding: 16px; }
    .dlg-foot { border-radius: 0; flex-wrap: wrap; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
    .dlg-head { padding: 14px 16px; }
    .text-row { grid-template-columns: 1fr; }
    .detail-grid > div[style*="span 2"] { grid-column: auto !important; }
    .preview-frame { height: 460px; }
    .code { font-size: 12px; padding-top: 44px; padding-right: 14px; }
    .tenant-cards { grid-template-columns: 1fr; }
    #toast { left: 12px; right: 12px; bottom: 16px; max-width: none; }
    input, select, textarea { font-size: 16px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"><form method="dialog" id="dlg-form"></form></dialog>
<dialog id="dlg2"><div id="dlg2-body" style="display:flex;flex-direction:column;height:100%"></div></dialog>
<div id="toast"></div>
<script>
(() => {
  const BASE = location.pathname.replace(/\/admin(\/.*)?$/, "");
  const API = BASE + "/admin/api";
  const ORIGIN = location.origin + BASE;
  const app = document.getElementById("app");
  const dlg = document.getElementById("dlg");
  const dlgForm = document.getElementById("dlg-form");
  let META = null;
  let tenant = null;
  let view = "dashboard";
  const state = { q: "", filters: {}, offset: 0 };
  const PAGE = 50;
  const refCache = {};

  // ---------- כלים ----------
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  async function api(path, opts = {}) {
    const res = await fetch(API + path, {
      method: opts.method || "GET",
      headers: opts.body ? { "content-type": "application/json" } : {},
      body: opts.body ? JSON.stringify(opts.body) : undefined,
      credentials: "same-origin",
    });
    const data = await res.json().catch(() => ({}));
    if (res.status === 401 && path !== "/login") { showLogin(); throw new Error("נדרשת התחברות"); }
    if (!res.ok) throw new Error(data.error || "שגיאה");
    return data;
  }
  async function copy(text) {
    try { await navigator.clipboard.writeText(text); toast("הועתק"); } catch { toast("לא ניתן להעתיק – סמנו והעתיקו ידנית", true); }

  function showLogin() {
    app.innerHTML = `<div class="login-wrap">

  // ---------- תצוגת ערכים ----------
  function fieldOf(entity, name) { return META.entities[entity]?.fields.find((f) => f.name === name); }
  function cell(entity, col, row) {
    const v = row[col];
    const f = fieldOf(entity, col);
    if (col === "status" || f?.type === "enum") {
      const label = f?.options?.find((o) => o.value === v)?.label ?? v;
      return v ? `<span class="pill ${esc(v)}">${esc(label)}</span>` : "";
    }
    if (col === "is_active") return v ? `<span class="pill on">פעיל</span>` : `<span class="pill off">לא פעיל</span>`;
    if (col === "send_email") return v ? `<span class="pill on">נשלח</span>` : `<span class="pill">לא</span>`;
    if (col === "ask_phone") return v ? `<span class="pill on">מותר</span>` : `<span class="pill">רק המתקשר</span>`;
    if (["price", "amount"].includes(col)) return `<b>${money(v)}</b>`;
    if (col === "access_days") return v ? `${esc(v)} ימים` : `<span class="muted">לצמיתות</span>`;
    if (col === "end_date" && entity === "subscriptions") {
      if (!v) return row.status === "active" ? `<span class="muted">לצמיתות</span>` : "";
      const today = new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Jerusalem" });
      return v <= today ? `<span class="pill off">פג ב-${esc(v)}</span>` : esc(v);
    }
    if (col === "customer_name" || (entity === "customers" && col === "full_name")) {
      const name = v || "ללא שם";
      return `<div class="person"><div class="avatar">${esc(initials(name))}</div><span>${esc(name)}</span></div>`;
    }
    if (col === "phones" || /phone/.test(col)) return `<span class="mono" dir="ltr">${esc(v)}</span>`;
    return esc(v);
  }

  function table(entity, rows, columns, opts = {}) {
    if (!rows.length) return `<div class="empty">${icon("box")}אין עדיין נתונים</div>`;
    const e = META.entities[entity];
    const editable = canEdit(entity) && !e.readOnly && opts.actions !== false;
    const actions = () => {
      if (opts.actions === false) return "";
      const btns = [];
      if (entity === "courses" && canView("settings")) btns.push(`<button type="button" class="btn sm" data-act="ext" title="הגדרת שלוחה">${icon("ext")} שלוחה</button>`);
      if (entity === "customers") btns.push(`<button type="button" class="btn sm" data-act="open">כרטיס</button>`);
      if (editable) btns.push(`<button type="button" class="btn sm icon" data-act="edit" title="עריכה">${icon("edit")}</button>`);
      if (editable && e.deletable) btns.push(`<button type="button" class="btn sm icon danger" data-act="del" title="מחיקה">${icon("trash")}</button>`);
      return `<td class="actions" data-label="">${btns.join("")}</td>`;
    };
    const clickable = opts.actions !== false && (editable || entity === "customers");
    return `<div class="table-wrap cards"><table>
      <thead><tr>${columns.map((c) => `<th>${esc(c.label)}</th>`).join("")}${opts.actions === false ? "" : "<th></th>"}</tr></thead>
      <tbody>${rows.map((r) => `<tr data-id="${r.id}" data-entity="${entity}" class="${clickable ? "click" : ""}">${columns.map((c) =>
        `<td class="${c.name === "details" ? "wrap" : ""}" data-label="${c.name === "id" ? "" : esc(c.label)}">${cell(entity, c.name, r)}</td>`).join("")}${actions()}</tr>`).join("")}</tbody>
    </table></div>`;
  }

  function bindRows(root, onChange = refresh) {
    root.querySelectorAll("tbody tr[data-entity]").forEach((tr) => {
      const entity = tr.dataset.entity, id = Number(tr.dataset.id);
      tr.onclick = (ev) => {
        const act = ev.target.closest("[data-act]")?.dataset.act;
        if (!act && !tr.classList.contains("click")) return;
        ev.stopPropagation();
        if (act === "ext") return api(`/${tenant}/courses/${id}`).then((r) => showExtension(r.row)).catch((err) => toast(err.message, true));
        if (act === "del") return deleteRow(entity, id, onChange);
        if (act === "open" || (!act && entity === "customers")) return showCustomer(id);
        return openForm(entity, id, {}, onChange);
      };
    });
  }

  async function deleteRow(entity, id, onDone = refresh) {
    const warn = {
      customers: "למחוק את הרוכש? יימחקו גם כל המנויים, ההזמנות והתשלומים שלו.",
      subscriptions: "למחוק את המנוי? הטלפונים שלו יאבדו את הגישה לקורס. התשלומים יישמרו.",
      orders: "למחוק את ההזמנה? התשלומים יישמרו.",
      payments: "למחוק את התשלום מהרשימה? (זה לא מבטל את העסקה בנדרים פלוס)",
    }[entity] ?? "למחוק?";
    if (!confirm(warn)) return;
    try {
      await api(`/${tenant}/${entity}/${id}`, { method: "DELETE", body: {} });
      delete refCache[tenant + entity];
      toast("נמחק"); onDone();
    } catch (err) { toast(err.message, true); }
  }

  // ---------- לוח בקרה ----------
  function chart(daily) {
    const days = [];
    for (let i = 29; i >= 0; i--) days.push(new Date(Date.now() - i * 864e5).toISOString().slice(0, 10));
    const map = Object.fromEntries(daily.map((d) => [d.day, d.amount]));
    const vals = days.map((d) => map[d] || 0);
    const max = Math.max(...vals, 1);
    const W = 600, H = 200, bw = W / days.length;
    const bars = vals.map((v, i) => {
      const h = Math.max(v ? 3 : 0, (v / max) * (H - 30));
      return `<rect class="bar" x="${W - (i + 1) * bw + 2}" y="${H - 18 - h}" width="${bw - 4}" height="${h}" rx="3"><title>${days[i].split("-").reverse().join("/")}: ${money(v)}</title></rect>`;
    }).join("");
    const anchor = (i) => (i === 0 ? "end" : i === days.length - 1 ? "start" : "middle");
    const lx = (i) => (i === 0 ? W - 2 : i === days.length - 1 ? 2 : W - i * bw - bw / 2);
    const labels = [0, 7, 14, 21, 29].map((i) => `<text x="${lx(i)}" y="${H - 4}" text-anchor="${anchor(i)}">${days[i].slice(8)}/${days[i].slice(5, 7)}</text>`).join("");
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><line x1="0" x2="${W}" y1="${H - 18}" y2="${H - 18}"/>${bars}${labels}</svg>`;
  }

          <div class="card"><div class="card-head">${icon("book")}<h3>קורסים מובילים</h3></div><div class="card-body">
            ${s.topCourses.length ? `<ul class="rank">${s.topCourses.map((x) => `<li><span style="min-width:110px">${esc(x.name)}</span><span class="bar"><i style="width:${(x.subs / maxSubs) * 100}%"></i></span><b>${x.subs}</b></li>`).join("")}</ul>` : `<div class="muted">אין עדיין קורסים</div>`}

        <div class="card"><div class="card-head">${icon("card")}<h3>תשלומים אחרונים</h3><div class="spacer"></div>${canView("payments") ? `<a href="#payments" class="btn sm" id="all-pay">לכל התשלומים</a>` : ""}</div>

  // ---------- רשימות ----------
  const SUBTITLES = {
    courses: "הקורסים שנמכרים בטלפון – מחיר, תוקף ומספר טלפונים לכל רכישה",

    customers: "כל מי שרכש בטלפון",
    products: "כל מה שנמכר בטלפון חוץ מקורסים – פגישה, שיעור, ספר. ההבדל רק בטקסטים",
    orders: "רכישות של מוצרים",
    payments: "כל התשלומים שהתקבלו דרך נדרים פלוס",

  async function renderList() {
    const entity = view;
    const e = META.entities[entity];
    if (!e) return go(navItems()[0].key);
    setTitle(e.label, SUBTITLES[entity] || "", !e.readOnly && !e.noCreate && canEdit(entity) ? `<button class="btn primary" id="new">${icon("plus")} חדש</button>` : "");
    const main = document.getElementById("main");
    const enumFilters = e.filters.map((name) => fieldOf(entity, name)).filter((f) => f && (f.type === "enum" || f.type === "bool"));
    main.innerHTML = `<div class="card">
      <div class="toolbar">
        <div class="search">${icon("search")}<input type="search" id="q" placeholder="חיפוש…" value="${esc(state.q)}"></div>
        ${enumFilters.map((f) => `<select data-filter="${f.name}"><option value="">${esc(f.label)}: הכל</option>${
          (f.type === "bool" ? [{ value: "1", label: "כן" }, { value: "0", label: "לא" }] : f.options)
            .map((o) => `<option value="${esc(o.value)}" ${state.filters[f.name] === o.value ? "selected" : ""}>${esc(o.label)}</option>`).join("")}</select>`).join("")}
      </div>
      <div id="list"><div class="empty">טוען…</div></div></div>`;
    let timer;
    document.getElementById("q").oninput = (ev) => { clearTimeout(timer); timer = setTimeout(() => { state.q = ev.target.value; state.offset = 0; loadList(); }, 300); };
    main.querySelectorAll("[data-filter]").forEach((s) => s.onchange = () => { state.filters[s.dataset.filter] = s.value; state.offset = 0; loadList(); });
    const nb = document.getElementById("new");
    if (nb) nb.onclick = () => openForm(entity, null);
    loadList();
  }

  async function loadList() {
    const entity = view;
    const e = META.entities[entity];
    const box = document.getElementById("list");
    if (!box) return;
    const params = new URLSearchParams({ limit: PAGE, offset: state.offset });
    if (state.q) params.set("q", state.q);
    for (const [k, v] of Object.entries(state.filters)) if (v !== "") params.set(k, v);
    try {
      const data = await api(`/${tenant}/${entity}?${params}`);
      const to = Math.min(data.offset + data.rows.length, data.total);
      box.innerHTML = table(entity, data.rows, e.columns) +
        (data.total > PAGE || data.offset ? `<div class="pager"><span>${data.offset + 1}–${to} מתוך ${data.total}</span><div class="spacer"></div>
          <button class="btn sm" id="prev" ${data.offset === 0 ? "disabled" : ""}>הקודם</button>
          <button class="btn sm" id="next" ${to >= data.total ? "disabled" : ""}>הבא</button></div>` : "");
      bindRows(box, loadList);
      const prev = document.getElementById("prev"), next = document.getElementById("next");
      if (prev) prev.onclick = () => { state.offset = Math.max(0, state.offset - PAGE); loadList(); };
      if (next) next.onclick = () => { state.offset += PAGE; loadList(); };
    } catch (err) { box.innerHTML = `<div class="empty err">${esc(err.message)}</div>`; }
  }

  // ---------- טפסים ----------
  async function refOptions(entity) {
    if (!refCache[tenant + entity]) {
      const data = await api(`/${tenant}/${entity}?limit=500`);
      refCache[tenant + entity] = data.rows.map((r) => ({
        value: String(r.id),
        label: entity === "customers" ? `${r.full_name || "ללא שם"} (${r.main_phone})` : `${r.name}${r.price !== undefined ? " · " + money(r.price) : ""}`,
        row: r,
      }));
    }
    return refCache[tenant + entity];
  }

  function inputFor(f, value, opts) {
    if (f.hidden) return "";
    const head = f.section ? `<div class="form-section">${esc(f.section)}</div>` : "";
    return head + fieldControl(f, value, opts);
  }
  function fieldControl(f, value, opts) {
    const v = value ?? f.default ?? "";
    const id = `f_${f.name}`;
    const ph = f.placeholder ? ` placeholder="${esc(f.placeholder)}"` : "";
    let control;
    switch (f.type) {
      case "longtext": control = `<textarea id="${id}" name="${f.name}" rows="3"${ph}>${esc(v)}</textarea>`; break;
      case "bool": {
        const on = v === "" ? true : v === true || v === 1 || v === "1";
        return `<div class="field"><label class="check"><input type="checkbox" id="${id}" name="${f.name}" ${on ? "checked" : ""}> ${esc(f.label)}</label>${f.help ? `<div class="help">${esc(f.help)}</div>` : ""}</div>`;
      }
      case "emails": control = `<input type="text" dir="ltr" id="${id}" name="${f.name}" value="${esc(v)}" placeholder="name@domain.co.il, other@domain.co.il">`; break;
      case "enum": control = `<select id="${id}" name="${f.name}">${f.required || f.default ? "" : `<option value=""></option>`}${f.options.map((o) =>
        `<option value="${esc(o.value)}" ${String(v) === o.value ? "selected" : ""}>${esc(o.label)}</option>`).join("")}</select>`; break;
      case "ref": {
        const list = opts[f.name] || [];
        const options = list.map((o) => `<option value="${esc(o.value)}" ${String(v) === o.value ? "selected" : ""}>${esc(o.label)}</option>`).join("");
        const search = list.length > 8 ? `<input type="search" class="ref-search" data-for="${id}" placeholder="חיפוש…" style="margin-bottom:6px">` : "";
        control = `${search}<select id="${id}" name="${f.name}"><option value="">בחרו…</option>${options}</select>`;
        break;
      }
      case "date": control = `<input type="date" id="${id}" name="${f.name}" value="${esc(v)}">`; break;
      case "datetime": control = `<input type="datetime-local" id="${id}" name="${f.name}" value="${esc(String(v).replace(" ", "T").slice(0, 16))}">`; break;
      case "int": case "real": control = `<input type="number" step="${f.type === "real" ? "0.01" : "1"}" min="0" id="${id}" name="${f.name}" value="${esc(v)}">`; break;
      case "phone": control = `<input type="tel" dir="ltr" id="${id}" name="${f.name}" value="${esc(v)}" placeholder="05XXXXXXXX">`; break;
      default: control = `<input type="text" id="${id}" name="${f.name}" value="${esc(v)}"${ph}>`;
    }
    return `<div class="field"><label for="${id}">${esc(f.label)}${f.required ? " *" : ""}</label>${control}${f.help ? `<div class="help">${esc(f.help)}</div>` : ""}</div>`;
  }

  function readForm(fields) {
    const out = {};
    for (const f of fields) {
      if (f.hidden) continue;
      const el = dlgForm.querySelector(`[name="${f.name}"]`);
      if (el) out[f.name] = f.type === "bool" ? el.checked : el.value;
    }
    return out;
  }

  function dialog(title, body, foot) {
    dlgForm.innerHTML = `<div class="dlg-head">${title}<div class="spacer"></div><button type="button" class="btn ghost icon" data-close>✕</button></div>
      <div class="dlg-body">${body}</div>${foot ? `<div class="dlg-foot">${foot}</div>` : ""}`;
    dlgForm.querySelectorAll("[data-close]").forEach((b) => b.onclick = () => dlg.close());
    bindCopy(dlgForm);
    if (!dlg.open) dlg.showModal();
  }

  const SINGULAR = { courses: "קורס", subscriptions: "מנוי", customers: "רוכש", products: "מוצר", orders: "הזמנה", payments: "תשלום" };

  async function openForm(entity, id, preset = {}, onDone) {
    const e = META.entities[entity];
    const fields = e.fields;
    let row = { ...preset };
    try {
      if (id) row = (await api(`/${tenant}/${entity}/${id}`)).row;
      const opts = {};
      for (const f of fields.filter((f) => f.type === "ref")) opts[f.name] = await refOptions(f.ref);
      const phonesField = entity === "subscriptions"
        ? `<div class="field"><label>טלפונים עם גישה לקורס *</label><div id="phones"></div>
            <button type="button" class="btn sm" id="add-phone">${icon("plus")} טלפון נוסף</button> <span class="help" id="phones-help"></span></div>` : "";
      const editable = canEdit(entity);
      dialog(`${id ? "עריכת" : "הוספת"} ${esc(SINGULAR[entity] || e.label)}${id ? ` <span class="muted">&nbsp;#${id}</span>` : ""}`,
        `${fields.map((f) => inputFor(f, row[f.name], opts)).join("")}${phonesField}<div class="err" id="form-err"></div>`,
        `${editable ? `<button class="btn primary" id="save">${icon("check")} שמירה</button>` : ""}<button type="button" class="btn" data-close>סגירה</button>
         ${entity === "courses" && id && canView("settings") ? `<button type="button" class="btn" id="ext">${icon("ext")} הגדרת שלוחה</button>` : ""}
         ${["courses", "products"].includes(entity) ? `<button type="button" class="btn" id="mail-preview">${icon("mail")} איך ייראה המייל</button>` : ""}
         <div class="spacer"></div>${id && editable && e.deletable ? `<button type="button" class="btn danger" id="del">${icon("trash")} מחיקה</button>` : ""}`);
      if (!editable) dlgForm.querySelectorAll("input, select, textarea").forEach((el) => el.disabled = true);

      dlgForm.querySelectorAll(".ref-search").forEach((inp) => { inp.disabled = !editable; inp.oninput = () => {
        const q = inp.value.trim().toLowerCase();
        const sel = dlgForm.querySelector("#" + inp.dataset.for);
        [...sel.options].forEach((o, i) => { if (i) o.hidden = q !== "" && !o.textContent.toLowerCase().includes(q); });
        const first = [...sel.options].find((o, i) => i && !o.hidden);
        if (q && first && (sel.selectedIndex <= 0 || sel.options[sel.selectedIndex].hidden)) { sel.value = first.value; sel.dispatchEvent(new Event("change")); }
      }; });

      if (entity === "subscriptions") {
        const courseSel = dlgForm.querySelector('[name="course_id"]');
        const priceIn = dlgForm.querySelector('[name="price"]');
        const box = dlgForm.querySelector("#phones");
        const maxPhones = () => Number(opts.course_id.find((o) => o.value === courseSel.value)?.row.max_phones) || 1;
        const sync = () => {
          dlgForm.querySelector("#add-phone").disabled = !editable || box.querySelectorAll("input").length >= maxPhones();
          dlgForm.querySelector("#phones-help").textContent = courseSel.value ? `עד ${maxPhones()} טלפונים לקורס הזה` : "";
        };
        const addPhone = (value = "") => {
          const r = document.createElement("div");
          r.className = "phone-row";
          r.innerHTML = `<input type="tel" dir="ltr" value="${esc(value)}" placeholder="05XXXXXXXX" ${editable ? "" : "disabled"}>${editable ? `<button type="button" class="btn icon danger" title="הסרה">${icon("trash")}</button>` : ""}`;
          const rm = r.querySelector("button");
          if (rm) rm.onclick = () => { r.remove(); if (!box.children.length) addPhone(); sync(); };
          box.appendChild(r); sync();
        };
        const initial = row.phone_list || preset.phone_list || [];
        (initial.length ? initial : [""]).forEach((p) => addPhone(p));
        dlgForm.querySelector("#add-phone").onclick = () => addPhone();
        courseSel.onchange = () => {
          const c = opts.course_id.find((o) => o.value === courseSel.value);
          if (c && !priceIn.value) priceIn.value = c.row.price;
          sync();
        };
      }
      if (entity === "orders") {
        const prodSel = dlgForm.querySelector('[name="product_id"]');
        const amountIn = dlgForm.querySelector('[name="amount"]');
        prodSel.onchange = () => { const p = opts.product_id.find((o) => o.value === prodSel.value); if (p && !amountIn.value) amountIn.value = p.row.price; };
      }

      const save = dlgForm.querySelector("#save");
      if (save) save.onclick = async (ev) => {
        ev.preventDefault();
        const body = readForm(fields);
        if (entity === "subscriptions") body.phones = [...dlgForm.querySelectorAll("#phones input")].map((i) => i.value.trim()).filter(Boolean);
        try {
          await api(`/${tenant}/${entity}${id ? "/" + id : ""}`, { method: id ? "PUT" : "POST", body });
          delete refCache[tenant + entity];
          dlg.close(); toast("נשמר");
          (onDone || refresh)();
        } catch (err) { dlgForm.querySelector("#form-err").textContent = err.message; }
      };
      const del = dlgForm.querySelector("#del");
      if (del) del.onclick = async () => { dlg.close(); await deleteRow(entity, id, onDone || refresh); };
      const ext = dlgForm.querySelector("#ext");
      if (ext) ext.onclick = () => showExtension(row);
      const mp = dlgForm.querySelector("#mail-preview");
      if (mp) mp.onclick = () => {
        const val = (n) => dlgForm.querySelector(`[name="${n}"]`)?.value || "";
        emailPreviewWindow({ entity, id, item: { email_subject: val("email_subject"), email_body: val("email_body") } });
      };
    } catch (err) { toast(err.message, true); }
  }

  // ---------- הגדרות (ימות + מיילים) ----------
  async function renderSettings(tab) {
    tab = tab || ls.get("yp_settings_tab") || "ivr";
    setTitle("הגדרות", currentTenant()?.title || "");
    const main = document.getElementById("main");
    const tabs = { ivr: ["phone", "הגדרות לימות המשיח"], texts: ["edit", "טקסטים בשיחה"], email: ["mail", "מיילים"] };
    if (!tabs[tab]) tab = "ivr";

  /** חלון תצוגה מקדימה של המייל (עם אפשרות למייל בדיקה) */

  async function sendTestEmail(target, beforeSend) {
    const to = prompt("לאיזו כתובת לשלוח את מייל הבדיקה?", ls.get("yp_test_to") || "");
    if (!to) return;
    ls.set("yp_test_to", to);
    try {
      if (beforeSend) await beforeSend();
      await api(`/${tenant}/email/test`, { method: "POST", body: { ...target, to } });
      toast("מייל בדיקה נשלח – בדקו את תיבת הדואר");
    } catch (err) { toast(err.message, true); }
  }

    const { settings, resend_ready } = await api(`/${tenant}/email`);
    const editable = canEdit("settings");
    const dis = editable ? "" : "disabled";
    const chips = META.email.placeholders.map((p) => `<span class="chip" data-ph="{${p.key}}" title="${esc(p.label)}">{${esc(p.key)}} · ${esc(p.label)}</span>`).join("");
    body.innerHTML = `
      ${resend_ready ? "" : `<div class="notice">${icon("help")}<div>עוד לא הוגדר מפתח Resend ${isAdmin() ? `– <a href="#platform" id="to-platform">להגדרות מערכת</a>` : "– פנו למנהל המערכת"}. בלי זה מיילים לא יישלחו.</div></div>`}
      <div class="notice info">${icon("help")}<div>כאן ההגדרות <b>הכלליות</b>: מאיזו כתובת נשלח, למי, ואיך נראה המייל.
        בכל <a href="#courses" data-go="courses">קורס</a> ו<a href="#products" data-go="products">מוצר</a>, בקבוצה "אחרי הרכישה", בוחרים אם לשלוח עליו מייל, ואפשר לתת לו נושא, תוכן ונמענים משלו.</div></div>
      <label class="switch-row"><input type="checkbox" name="enabled" ${settings.enabled ? "checked" : ""} ${dis} style="width:20px;height:20px;accent-color:var(--brand)">
        <div><b>שליחת מיילים פעילה</b><span class="muted">כבוי = לא נשלח שום מייל, גם אם בקורס או במוצר מסומן לשלוח</span></div></label>
      <div class="email-grid">
        <div>
          <div class="form-section">שולח ונמענים</div>
          <div class="grid2">
            <div class="field"><label>שם השולח</label><input name="from_name" value="${esc(settings.from_name)}" placeholder="לא חובה" ${dis}></div>
            <div class="field"><label>כתובת השולח *</label><input name="from_email" dir="ltr" value="${esc(settings.from_email)}" placeholder="office@your-domain.co.il" ${dis}>
              <div class="help">בדומיין שמאומת ב-Resend</div></div>
          </div>
          <div class="field"><label>נמענים</label><input name="recipients" dir="ltr" value="${esc(settings.recipients)}" placeholder="owner@domain.co.il, office@domain.co.il" ${dis}>
            <div class="help">מי מקבל את המיילים על כל רכישה. כמה כתובות – מופרדות בפסיק</div></div>
          <div class="field"><label>כתובת למענה (Reply-To)</label><input name="reply_to" dir="ltr" value="${esc(settings.reply_to)}" placeholder="לא חובה" ${dis}></div>
          <div class="form-section">התבנית הכללית</div>
          <p class="muted" style="margin:-4px 0 6px;font-size:13px">לחצו בתוך הנושא או התוכן, ואז על משתנה כדי להוסיף אותו:</p>
          <div class="chips">${chips}</div>
          <div class="field"><label>נושא המייל</label><input name="subject" value="${esc(settings.subject)}" ${dis}></div>
          <div class="field"><label>תוכן</label><textarea name="body" rows="6" ${dis}>${esc(settings.body)}</textarea></div>
          <label class="check" style="margin-bottom:16px"><input type="checkbox" name="show_details" ${settings.show_details ? "checked" : ""} ${dis}> להוסיף טבלה מסודרת עם פרטי הרכישה (מה נרכש, מחיר, טלפונים, תוקף, מועד, אסמכתא)</label>
          ${editable ? `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn primary" id="save-email">${icon("check")} שמירה</button>
            <button type="button" class="btn" id="test-email">${icon("send")} שליחת מייל בדיקה</button><span class="err" id="email-err"></span></div>` : ""}
        </div>
        <div>
          <div class="form-section">תצוגה מקדימה</div>
          <div class="muted" style="font-size:12.5px">נושא</div><div style="font-weight:700;margin-bottom:10px" id="pv-subject">—</div>
          <iframe class="preview-frame" id="pv-frame" sandbox="" title="תצוגה מקדימה"></iframe>
          <p class="muted" style="font-size:12.5px;margin:6px 0 0">עם פרטי רכישה לדוגמה (קורס). מתעדכן תוך כדי כתיבה.</p>
        </div>
      </div>`;

    const q = (n) => body.querySelector(`[name="${n}"]`);
    const collect = () => ({
      enabled: q("enabled").checked, show_details: q("show_details").checked,
      from_name: q("from_name").value, from_email: q("from_email").value, recipients: q("recipients").value, reply_to: q("reply_to").value,
      subject: q("subject").value, body: q("body").value,
    });
    let pvTimer;
    const preview = () => { clearTimeout(pvTimer); pvTimer = setTimeout(async () => {
      try {
        const mail = await api(`/${tenant}/email/preview`, { method: "POST", body: { settings: collect() } });
        document.getElementById("pv-subject").textContent = mail.subject;
        document.getElementById("pv-frame").srcdoc = mail.html;
      } catch (err) { document.getElementById("pv-subject").textContent = err.message; }
    }, 250); };
    body.querySelectorAll("input, textarea").forEach((el) => el.addEventListener(el.type === "checkbox" ? "change" : "input", preview));
    preview();

    let lastFocus = q("body");
    [q("subject"), q("body")].forEach((el) => el.addEventListener("focus", () => { lastFocus = el; }));
    body.querySelectorAll("[data-ph]").forEach((c) => c.onclick = () => {
      if (lastFocus.disabled) return;
      const st = lastFocus.selectionStart ?? lastFocus.value.length;
      lastFocus.value = lastFocus.value.slice(0, st) + c.dataset.ph + lastFocus.value.slice(lastFocus.selectionEnd ?? st);
      lastFocus.focus(); preview();
    });
    body.querySelectorAll("[data-go]").forEach((a) => a.onclick = (e) => { e.preventDefault(); go(a.dataset.go); });
    const tp = document.getElementById("to-platform"); if (tp) tp.onclick = (e) => { e.preventDefault(); go("platform"); };

    const saveSettings = () => api(`/${tenant}/email`, { method: "PUT", body: collect() });
    const saveBtn = document.getElementById("save-email");
    if (saveBtn) saveBtn.onclick = async (e) => {
      e.preventDefault();
      try { await saveSettings(); document.getElementById("email-err").textContent = ""; toast("הגדרות המייל נשמרו"); }
      catch (err) { document.getElementById("email-err").textContent = err.message; }
    };
    const testBtn = document.getElementById("test-email");
    if (testBtn) testBtn.onclick = (e) => { e.preventDefault(); sendTestEmail({}, saveSettings); };
  }

  /** כל הטקסטים שהמתקשר שומע, לפי קבוצות. ריק = ברירת המחדל. */
  async function renderTextsTab(body) {
    const { texts } = await api(`/${tenant}/texts`);
    const editable = canEdit("settings");
    const groups = [...new Set(texts.map((x) => x.group))];
    body.innerHTML = `
      <div class="notice info">${icon("help")}<div>כל מה שהמתקשר שומע בשיחה. משנים טקסט ושומרים – וזה מה שיושמע מעכשיו.
        שדה ריק = טקסט ברירת המחדל (מוצג באפור). מילים בסוגריים מסולסלים, למשל <b>{name}</b>, מוחלפות בערך האמיתי.
        סימני פיסוק (נקודה, פסיק, מקף, גרשיים) לא מוקראים. טקסט ההצעה וההצלחה אפשר לשנות גם בכל קורס ומוצר בנפרד.</div></div>
      ${groups.map((g) => `<div class="form-section">${esc(g)}</div>${texts.filter((x) => x.group === g).map((x) => `
        <div class="text-row ${x.value ? "changed" : ""}" data-key="${esc(x.key)}">
          <div class="lbl"><b>${esc(x.label)}</b>${x.value ? `<span class="pill on" style="margin-top:4px">שונה</span>` : ""}</div>
          <div><textarea rows="2" placeholder="${esc(x.default)}" ${editable ? "" : "disabled"}>${esc(x.value)}</textarea>
            ${x.vars ? `<div class="vars">${Object.entries(x.vars).map(([k, v]) => `<b dir="ltr">{${esc(k)}}</b> ${esc(v)}`).join(" · ")}</div>` : ""}
            ${editable ? `<button type="button" class="btn sm ghost reset" ${x.value ? "" : "hidden"}>חזרה לברירת המחדל</button>` : ""}</div>
        </div>`).join("")}`).join("")}
      ${editable ? `<div style="display:flex;gap:10px;align-items:center;margin-top:18px;position:sticky;bottom:0;background:#fff;padding:12px 0">
        <button class="btn primary" id="save-texts">${icon("check")} שמירת הטקסטים</button><span class="err" id="texts-err"></span></div>` : ""}`;
    body.querySelectorAll(".text-row").forEach((row) => {
      const ta = row.querySelector("textarea"), reset = row.querySelector(".reset");
      ta.addEventListener("input", () => { row.classList.toggle("changed", !!ta.value.trim()); if (reset) reset.hidden = !ta.value.trim(); });
      // לחיצה על שדה ריק ממלאת את ברירת המחדל, כדי לערוך אותה במקום לכתוב מהתחלה
      ta.addEventListener("focus", () => { if (!ta.value.trim() && !ta.disabled) { ta.value = ta.placeholder; ta.dispatchEvent(new Event("input")); } });
      ta.addEventListener("blur", () => { if (ta.value.trim() === ta.placeholder) { ta.value = ""; ta.dispatchEvent(new Event("input")); } });
      if (reset) reset.onclick = () => { ta.value = ""; ta.dispatchEvent(new Event("input")); };
    });
    const save = document.getElementById("save-texts");
    if (save) save.onclick = async (e) => {
      e.preventDefault();
      const out = {};
      body.querySelectorAll(".text-row").forEach((row) => { out[row.dataset.key] = row.querySelector("textarea").value; });
      try { await api(`/${tenant}/texts`, { method: "PUT", body: { texts: out } }); toast("הטקסטים נשמרו"); renderTextsTab(body); }
      catch (err) { document.getElementById("texts-err").textContent = err.message; }
    };
  }

      ${step(courses.length > 0, "2. יצירת קורס", `<p>ב<a href="#courses" data-go="courses">קורסים</a> לוחצים "חדש" וממלאים:</p>
        <p>• <b>שם</b> – מה שהמתקשר ישמע. • <b>מזהה קורס</b> – מספר או מילה באנגלית (למשל 1), זה מה שנכתב בכתובת. • <b>מחיר</b>.<br>
        • <b>תוקף גישה בימים</b> – ריק = לצמיתות. • <b>כמה טלפונים לכל רכישה</b>.<br>
        • <b>פעיל</b> ו<b>מה קורה למי שרכש כשהקורס לא פעיל</b> – ממשיך לקבל גישה, או נחסם ושומע הסבר.</p>`)}
      ${step(false, "3. שלוחת הקורס בימות", `<p>בשלוחה שבה נמצא תוכן הקורס מוסיפים בדיקת הרשאה. מי שיש לו מנוי בתוקף ממשיך לתוכן, ומי שלא – עובר לתת-שלוחה 1:</p>
        ${codeBlock(yemotFiles.courseCheck(t, code))}`)}
      ${step(false, "4. תת-שלוחה 1 – רכישה", `<p>יוצרים בתוך שלוחת הקורס תת-שלוחה 1:</p>
        ${codeBlock(yemotFiles.coursePurchase(t, code))}
        <p class="muted">מה המתקשר ישמע: "אין לך מנוי לקורס…" או "תוקף המנוי הסתיים" ← הצעה עם מחיר (ותוקף אם יש) ← טלפונים: 1 וסולמית למספר שממנו התקשר, או הקשת מספר ואישור ←
        "להוספת מספר נוסף 1, להמשך 2" ← סליקה בנדרים פלוס ← "רכשת בהצלחה את הקורס" וחזרה לתוכן. אם התשלום לא הצליח – לא נשמר כלום.</p>`)}
      ${step(false, "5. מוצרים (לא חובה)", `<p>ב<a href="#products" data-go="products">מוצרים</a> יוצרים כל דבר שנמכר בטלפון – פגישה, שיעור, ספר. אין סוגים: כותבים שם, מחיר, ומה המתקשר ישמע אחרי הרכישה
        (למשל "הפגישה נקבעה, ניצור איתך קשר"). אם צריך טלפון אחר ליצירת קשר – מסמנים "לאפשר לבחור טלפון אחר".</p>
        <p>ההגדרה המדויקת לשלוחה בימות מופיעה ב<a href="#settings" data-go="settings">הגדרות ← הגדרות לימות המשיח</a>.</p>`)}
      ${step(email.resend_ready && !!email.settings.from_email, "6. מיילים", `<p>ב<a href="#settings" data-go="settings">הגדרות</a> ← מיילים: כתובת שולח (בדומיין שמאומת ב-Resend), נמענים, ותבנית כללית עם תצוגה מקדימה.
        בכל קורס ומוצר, תחת "אחרי הרכישה", בוחרים אם לשלוח מייל, ואפשר נושא ותוכן משלו.</p>`)}
      ${step(false, "7. טקסטים בשיחה (לא חובה)", `<p>ב<a href="#settings" data-go="settings">הגדרות</a> ← טקסטים בשיחה אפשר לשנות כל משפט שהמתקשר שומע. מה שלא משנים נשאר בברירת המחדל.</p>`)}
      ${step(false, "8. בדיקה בטלפון", `<p>מתקשרים, נכנסים לשלוחת הקורס, רוכשים בסכום קטן, ובודקים:</p>
        <p>• ב<a href="#ivr_log" data-go="ivr_log">יומן השיחות</a> רואים כל שלב (הצעה, תחילת תשלום, תשלום הצליח, מייל נשלח).<br>
        • ב<a href="#subscriptions" data-go="subscriptions">מנויים</a> מופיע המנוי עם הטלפונים.<br>• כניסה חוזרת לשלוחת הקורס – נכנסים ישר לתוכן.</p>`)}
    </div></div>`;
    bindCopy(main);
    main.querySelectorAll("[data-go]").forEach((a) => a.onclick = (e) => { e.preventDefault(); go(a.dataset.go); });
  }

  // ---------- לקוחות והרשאות (מנהל) ----------
  async function reloadMeta() { META = await api("/meta"); }

  async function renderTenants() {
    setTitle("לקוחות והרשאות", "הלקוחות שלך, ההגדרות שלהם והמשתמשים באזור האישי", `<button class="btn primary" id="new-tenant">${icon("plus")} לקוח חדש</button>`);
    document.getElementById("new-tenant").onclick = () => openTenant(null);
    await reloadMeta();
    const main = document.getElementById("main");
    main.innerHTML = `<div class="tenant-cards">${META.tenants.map((t) => `
      <div class="card tenant-card" data-slug="${esc(t.slug)}">
        <div style="display:flex;align-items:center;gap:12px"><div class="avatar" style="width:42px;height:42px">${esc(initials(t.title))}</div>
          <div style="flex:1"><h3>${esc(t.title)}</h3><span class="muted">${esc(t.contact_name || "")}</span></div>
          <span class="pill ${t.is_active ? "on" : "off"}">${t.is_active ? "פעיל" : "מושבת"}</span></div>
        <div class="meta"><div><span>מספר לקוח</span><b>${esc(t.client_number)}</b></div>
          <div><span>מוסד בנדרים</span><b>${t.nedarim_mosad_id ? esc(t.nedarim_mosad_id) : "—"}</b></div></div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <span class="pill ${t.nedarim_mosad_id ? "on" : "warn"}">סליקה</span><span class="pill ${t.email_ready ? "on" : "warn"}">מיילים</span></div>
      </div>`).join("")}</div>`;
    main.querySelectorAll("[data-slug]").forEach((c) => c.onclick = () => openTenant(c.dataset.slug));
  }

  function openTenant(slug, tab = "details") {
    const t = slug ? META.tenants.find((x) => x.slug === slug) : { is_active: 1 };
    const f = (name, label, value, attrs = "", help = "") => `<div class="field"><label>${label}</label><input name="${name}" value="${esc(value)}" ${attrs}>${help ? `<div class="help">${help}</div>` : ""}</div>`;
    const tabs = slug ? `<div class="tabs" style="margin:-20px -22px 18px">
      <button type="button" data-tt="details" class="${tab === "details" ? "active" : ""}">פרטים</button>
      <button type="button" data-tt="users" class="${tab === "users" ? "active" : ""}">משתמשים והרשאות</button>
      <button type="button" data-tt="key" class="${tab === "key" ? "active" : ""}">מפתח וכתובות</button></div>` : "";
    if (tab !== "details" && slug) {
      dialog(esc(t.title), `${tabs}<div id="tt-body"><div class="empty">טוען…</div></div>`, `<button type="button" class="btn" data-close>סגירה</button>`);
      bindTenantTabs(slug);
      return tab === "users" ? renderUsersTab(t) : renderKeyTab(t);
    }
    const details = `
      <div class="grid2">
        ${f("title", "שם הלקוח *", t.title)}
        ${f("client_number", "מספר לקוח", t.client_number ?? "", 'dir="ltr" inputmode="numeric"', slug ? "מופיע בכל הכתובות בימות. שינוי מחייב לעדכן את השלוחות." : "ריק = המספר הפנוי הבא")}
        ${f("slug", "מזהה באנגלית *", t.slug, slug ? 'dir="ltr" disabled' : 'dir="ltr" placeholder="cohen-store"', "פנימי בלבד (שמות הטבלאות). לא ניתן לשנות.")}
        ${f("nedarim_mosad_id", "מספר מוסד בנדרים פלוס", t.nedarim_mosad_id, 'dir="ltr" inputmode="numeric"')}
        ${f("contact_name", "איש קשר", t.contact_name)}
        ${f("contact_phone", "טלפון איש קשר", t.contact_phone, 'dir="ltr"')}
      </div>
      <div class="field"><label>הערות</label><textarea name="notes">${esc(t.notes)}</textarea></div>
      <label class="check"><input type="checkbox" name="is_active" ${t.is_active ? "checked" : ""}> פעיל (כשמושבת – השלוחות והאזור האישי לא עובדים)</label>
      <div class="err" id="form-err" style="margin-top:10px"></div>`;
    dialog(slug ? esc(t.title) : "לקוח חדש", `${tabs}${details}${slug ? "" : `<div class="notice info" style="margin-top:12px">${icon("help")}<div>בשמירה ייווצרו ללקוח טבלאות משלו במסד, מפתח לשלוחות ומספר לקוח.</div></div>`}`,
      `<button class="btn primary" id="save">${icon("check")} שמירה</button><button type="button" class="btn" data-close>ביטול</button>`);
    if (slug) bindTenantTabs(slug);
    dlgForm.querySelector("#save").onclick = async (ev) => {
      ev.preventDefault();
      const v = (n) => dlgForm.querySelector(`[name="${n}"]`);
      const body = { title: v("title").value, client_number: v("client_number").value, nedarim_mosad_id: v("nedarim_mosad_id").value,
        contact_name: v("contact_name").value, contact_phone: v("contact_phone").value, notes: v("notes").value, is_active: v("is_active").checked };
      try {
        if (slug) await api(`/tenants/${slug}`, { method: "PUT", body });
        else { body.slug = v("slug").value.trim().toLowerCase(); const r = await api("/tenants", { method: "POST", body }); tenant = r.tenant.slug; ls.set("yp_tenant", tenant); }
        dlg.close(); toast("נשמר"); await reloadMeta(); view = "tenants"; renderShell();
      } catch (err) { dlgForm.querySelector("#form-err").textContent = err.message; }
    };
  }
  function bindTenantTabs(slug) { dlgForm.querySelectorAll("[data-tt]").forEach((b) => b.onclick = () => openTenant(slug, b.dataset.tt)); }

  function renderKeyTab(t) {
    const box = document.getElementById("tt-body");
    box.innerHTML = `
      <div class="field"><label>מפתח לשלוחות רכישה (key)</label>${codeBlock(t.api_key)}
        <div class="help">נמצא בכל כתובת של שלוחת רכישה. אם דלף – יוצרים מפתח חדש ומעדכנים את השלוחות.</div></div>
      <button type="button" class="btn danger" id="rotate">יצירת מפתח חדש</button>
      <div class="section-title">דוגמה – קורס עם מזהה 1</div>
      <p class="muted" style="margin:0 0 8px">שלוחת הקורס:</p>${codeBlock(yemotFiles.courseCheck(t, "1"))}
      <p class="muted" style="margin:0 0 8px">תת-שלוחה 1 (רכישה):</p>${codeBlock(yemotFiles.coursePurchase(t, "1"))}
      <p class="muted" style="font-size:13px">ההגדרות המלאות לכל קורס ומוצר: הגדרות ← הגדרות לימות המשיח.</p>`;
    bindCopy(box);
    box.querySelector("#rotate").onclick = async () => {
      if (!confirm("ליצור מפתח חדש? המפתח הישן יפסיק לעבוד, ויש לעדכן את כל שלוחות הרכישה בימות.")) return;
      try { await api(`/tenants/${t.slug}/key`, { method: "POST", body: {} }); await reloadMeta(); toast("נוצר מפתח חדש"); openTenant(t.slug, "key"); }
      catch (err) { toast(err.message, true); }
    };
  }

  async function renderUsersTab(t) {
    const box = document.getElementById("tt-body");
    try {
      const { rows } = await api(`/tenants/${t.slug}/users`);
      box.innerHTML = `
        <p class="muted" style="margin-top:0">משתמשים של ${esc(t.title)} נכנסים לאזור האישי (באותה כתובת) עם שם משתמש וסיסמה, ורואים רק את הנתונים של ${esc(t.title)} – לפי ההרשאות שתקבעו כאן.</p>
        ${rows.length ? `<div class="table-wrap card" style="margin-bottom:12px"><table><thead><tr><th>משתמש</th><th>שם</th><th>כניסה אחרונה</th><th>סטטוס</th><th></th></tr></thead><tbody>
          ${rows.map((u) => `<tr><td class="mono" dir="ltr">${esc(u.username)}</td><td>${esc(u.display_name || "")}</td><td>${esc(u.last_login_at || "—")}</td>
            <td><span class="pill ${u.is_active ? "on" : "off"}">${u.is_active ? "פעיל" : "חסום"}</span></td>
            <td class="actions"><button type="button" class="btn sm icon" data-user="${u.id}">${icon("edit")}</button><button type="button" class="btn sm icon danger" data-deluser="${u.id}">${icon("trash")}</button></td></tr>`).join("")}
          </tbody></table></div>` : `<div class="empty">${icon("user")}עדיין אין משתמשים</div>`}
        <button type="button" class="btn primary" id="add-user">${icon("plus")} משתמש חדש</button>`;
      box.querySelector("#add-user").onclick = () => userForm(t, null);
      box.querySelectorAll("[data-user]").forEach((b) => b.onclick = () => userForm(t, rows.find((u) => String(u.id) === b.dataset.user)));
      box.querySelectorAll("[data-deluser]").forEach((b) => b.onclick = async () => {
        if (!confirm("למחוק את המשתמש?")) return;
        try { await api(`/tenants/${t.slug}/users/${b.dataset.deluser}`, { method: "DELETE", body: {} }); toast("נמחק"); renderUsersTab(t); }
        catch (err) { toast(err.message, true); }
      });
    } catch (err) { box.innerHTML = `<div class="err">${esc(err.message)}</div>`; }
  }

  function userForm(t, u) {
    const perms = u?.permissions || Object.fromEntries(META.sections.map((s) => [s.key, s.key === "settings" ? "none" : "view"]));
    const lvl = [["none", "ללא"], ["view", "צפייה"], ["edit", "עריכה"]];
    dialog(u ? `עריכת משתמש · ${esc(u.username)}` : `משתמש חדש · ${esc(t.title)}`, `
      <div class="grid2">
        <div class="field"><label>שם משתמש *</label><input name="username" dir="ltr" value="${esc(u?.username)}" ${u ? "disabled" : ""} placeholder="moshe"></div>
        <div class="field"><label>שם לתצוגה</label><input name="display_name" value="${esc(u?.display_name)}"></div>
        <div class="field"><label>${u ? "סיסמה חדשה (ריק = ללא שינוי)" : "סיסמה *"}</label><input name="password" type="password" autocomplete="new-password"><div class="help">לפחות 8 תווים</div></div>
        <div class="field"><label>&nbsp;</label><label class="check"><input type="checkbox" name="is_active" ${!u || u.is_active ? "checked" : ""}> פעיל</label></div>
      </div>
      <div class="section-title" style="margin-top:4px">הרשאות</div>
      <div class="card"><table class="perm-table"><thead><tr><th>אזור</th>${lvl.map(([, l]) => `<th style="text-align:center">${l}</th>`).join("")}</tr></thead><tbody>
        ${META.sections.map((s) => `<tr><td>${esc(s.label)}</td>${lvl.map(([v]) => `<td style="text-align:center"><input type="radio" name="p_${s.key}" value="${v}" ${(perms[s.key] || "none") === v ? "checked" : ""}></td>`).join("")}</tr>`).join("")}
      </tbody></table></div>
      <div style="margin-top:10px;display:flex;gap:6px"><button type="button" class="btn sm" data-all="none">הכל ללא</button><button type="button" class="btn sm" data-all="view">הכל צפייה</button><button type="button" class="btn sm" data-all="edit">הכל עריכה</button></div>
      <div class="err" id="form-err" style="margin-top:10px"></div>`,
      `<button class="btn primary" id="save">${icon("check")} שמירה</button><button type="button" class="btn" id="back-users">חזרה</button>`);
    dlgForm.querySelectorAll("[data-all]").forEach((b) => b.onclick = () => dlgForm.querySelectorAll(`input[type=radio][value="${b.dataset.all}"]`).forEach((r) => r.checked = true));
    dlgForm.querySelector("#back-users").onclick = () => openTenant(t.slug, "users");
    dlgForm.querySelector("#save").onclick = async (ev) => {
      ev.preventDefault();
      const v = (n) => dlgForm.querySelector(`[name="${n}"]`);
      const permissions = Object.fromEntries(META.sections.map((s) => [s.key, dlgForm.querySelector(`[name="p_${s.key}"]:checked`)?.value || "none"]));
      const body = { display_name: v("display_name").value, is_active: v("is_active").checked, permissions };
      if (v("password").value) body.password = v("password").value;
      try {
        if (u) await api(`/tenants/${t.slug}/users/${u.id}`, { method: "PUT", body });
        else await api(`/tenants/${t.slug}/users`, { method: "POST", body: { ...body, username: v("username").value } });
        toast("נשמר"); openTenant(t.slug, "users");
      } catch (err) { dlgForm.querySelector("#form-err").textContent = err.message; }
    };
  }

  // ---------- הגדרות מערכת (מנהל) ----------
  async function renderPlatform() {
    setTitle("הגדרות מערכת", "הגדרות שמשותפות לכל הלקוחות");
    const main = document.getElementById("main");
    try {
      const p = await api("/platform");
      main.innerHTML = `<div class="card"><div class="card-head">${icon("mail")}<h3>Resend – שליחת מיילים</h3>
        <div class="spacer"></div><span class="pill ${p.resend_api_key ? "on" : "warn"}">${p.resend_api_key ? "מחובר" : "לא מוגדר"}</span></div><div class="card-body">
        <p class="muted" style="margin-top:0">המפתח משמש לשליחת המיילים של כל הלקוחות. כל לקוח קובע בהגדרות שלו מאיזו כתובת לשלוח – הכתובת חייבת להיות בדומיין שמאומת ב-Resend.</p>
        <div class="field"><label>מפתח API של Resend</label><input id="resend" dir="ltr" placeholder="re_...">
          <div class="help">${p.resend_api_key ? `מוגדר: <span class="mono">${esc(p.resend_api_key)}</span>. השאירו ריק כדי לא לשנות.` : "עדיין לא מוגדר."} המפתח לא מוצג במלואו אחרי השמירה.</div></div>
        <div style="display:flex;gap:8px"><button class="btn primary" id="save-platform">${icon("check")} שמירה</button>
          ${p.resend_api_key ? `<button class="btn danger" id="clear-platform">הסרת המפתח</button>` : ""}</div>
        <div class="section-title">איך משיגים מפתח</div>
        <p>1. נכנסים ל-resend.com ← <b>API Keys</b> ← <b>Create API Key</b> (הרשאת Sending access מספיקה).<br>
        2. ב-<b>Domains</b> מוודאים שהדומיין שלכם במצב Verified.<br>3. מדביקים כאן את המפתח ושומרים.<br>
        4. אצל כל לקוח: הגדרות ← מיילים ← כתובת שולח בדומיין הזה ← "שליחת מייל בדיקה".</p>
      </div></div>
      <div class="card" style="margin-top:16px"><div class="card-head">${icon("edit")}<h3>שורת התחתית בכל מייל</h3></div><div class="card-body">
        <p class="muted" style="margin-top:0">מופיעה בתחתית כל המיילים של כל הלקוחות.</p>
        <div class="field"><label>הטקסט</label><input id="footer" value="${esc(p.email_footer)}" placeholder="${esc(p.default_email_footer)}" maxlength="200">
          <div class="help">ריק = ברירת המחדל: ${esc(p.default_email_footer)}</div></div>
        <button class="btn primary" id="save-footer">${icon("check")} שמירה</button>
      </div></div>`;
      document.getElementById("save-footer").onclick = async () => {
        try { await api("/platform", { method: "PUT", body: { email_footer: document.getElementById("footer").value } }); toast("נשמר"); renderPlatform(); } catch (err) { toast(err.message, true); }
      };
      document.getElementById("save-platform").onclick = async () => {
        const key = document.getElementById("resend").value.trim();
        if (!key) return toast("לא הוזן מפתח חדש");
        try { await api("/platform", { method: "PUT", body: { resend_api_key: key } }); toast("נשמר"); renderPlatform(); } catch (err) { toast(err.message, true); }
      };
      const clr = document.getElementById("clear-platform");
      if (clr) clr.onclick = async () => {
        if (!confirm("להסיר את מפתח Resend? מיילים יפסיקו להישלח.")) return;
        try { await api("/platform", { method: "PUT", body: { resend_api_key: "" } }); toast("הוסר"); renderPlatform(); } catch (err) { toast(err.message, true); }
      };
    } catch (err) { main.innerHTML = `<div class="card empty err">${esc(err.message)}</div>`; }
  }

  start().catch(() => {});
})();
</script>
</body>
</html>
